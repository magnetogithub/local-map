name: Immutable territory catalog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*prompt14*'
      - 'data/source-locks/prompt14-*'
      - 'data/derived/prompt14/**'
      - 'src/lib/test-only/**'
      - 'src/lib/map/**'
      - 'src/lib/projection/**'
      - 'src/app/api/world/catalog/**'
      - 'data/catalog-consumers/prompt14/**'
      - 'public/data/territory-catalog/**'
      - 'vitest.config.ts'
      - 'package-lock.json'
      - '.github/workflows/prompt14-catalog.yml'
jobs:
  validate-and-replay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm.cmd ci
      - run: node --test scripts/prompt14-catalog-core.node-test.mjs scripts/prompt14-catalog-topology.node-test.mjs scripts/prompt14-boundary-arrangement.node-test.mjs scripts/prompt14-checkpoint.node-test.mjs
      - run: node --max-old-space-size=8192 scripts/regenerate-prompt14-sources.mjs .tmp/prompt14-catalog/ci-source-first
      - run: node --max-old-space-size=8192 scripts/regenerate-prompt14-sources.mjs .tmp/prompt14-catalog/ci-source-second
      - run: node scripts/verify-prompt14-source-correspondence.mjs .tmp/prompt14-catalog/ci-source-first
      - run: node scripts/verify-prompt14-source-correspondence.mjs .tmp/prompt14-catalog/ci-source-second
      - run: node scripts/resolve-prompt14-boundary-observations.mjs
      - run: node --max-old-space-size=8192 scripts/verify-prompt14-construction-tails.mjs
      - run: node --max-old-space-size=8192 scripts/generate-prompt14-catalog.mjs .tmp/prompt14-catalog/ci-first --sources .tmp/prompt14-catalog/ci-source-first
      - run: node --max-old-space-size=8192 scripts/generate-prompt14-catalog.mjs .tmp/prompt14-catalog/ci-second --sources .tmp/prompt14-catalog/ci-source-second
      - run: node scripts/generate-prompt14-catalog.mjs --compare .tmp/prompt14-catalog/ci-first .tmp/prompt14-catalog/ci-second
      - run: npx.cmd vitest run src/lib/test-only/production-catalog-migration.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          PROMPT14_CATALOG_OUTPUT: .tmp/prompt14-catalog/ci-first
      - run: npx.cmd vitest run src/lib/test-only/production-catalog-migration.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          PROMPT14_CATALOG_OUTPUT: .tmp/prompt14-catalog/ci-second
      - run: node scripts/write-prompt14-catalog-checkpoint.mjs --first .tmp/prompt14-catalog/ci-first --second .tmp/prompt14-catalog/ci-second --source-first .tmp/prompt14-catalog/ci-source-first --source-second .tmp/prompt14-catalog/ci-source-second --output .tmp/prompt14-catalog/ci-review-c.json --freeze --freeze-output .tmp/prompt14-catalog/ci-frozen-ref.json
        if: always()
      - run: node --max-old-space-size=8192 scripts/prepare-prompt14-catalog-consumer.mjs .tmp/prompt14-consumer/ci-first
      - run: node --max-old-space-size=8192 scripts/prepare-prompt14-catalog-consumer.mjs .tmp/prompt14-consumer/ci-second
      - run: node scripts/publish-prompt14-catalog-consumer.mjs .tmp/prompt14-consumer/ci-first .tmp/prompt14-consumer/ci-second
      - run: node scripts/verify-prompt14-catalog-consumer.mjs .tmp/prompt14-consumer/ci-browser .tmp/prompt14-catalog/ci-first
      - run: npx.cmd vitest run src/lib/map/catalog-consumer.test.ts src/lib/projection/country-panel-projection.test.ts src/lib/projection/country-search-index-patch.test.ts src/lib/world/initial-world-state-v2.test.ts src/lib/game-ui/country-view-projection.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npx.cmd tsc --noEmit
      - run: npm.cmd run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: node scripts/run-prompt14-catalog-consumer-http-smoke.mjs 3139 .tmp/prompt14-consumer/ci-http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt14-review-c-evidence
          include-hidden-files: true
          path: |
            .tmp/prompt14-catalog/ci-*
            .tmp/prompt14-consumer/ci-*
            reports/prompt14/14-02-boundary-observation-resolution.json
            reports/prompt14/14-02-construction-tail-proof.json
